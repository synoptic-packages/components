<script>
	// The static build (Storybook 10.4 / rolldown) does not apply the `define` keys from
	// `.storybook/main.ts` `viteFinal`, so they arrive as raw, undefined identifiers and any
	// evaluation throws — this kills the preview module and leaves every story stuck on
	// Storybook's "preparing" loader with no visible error. Declaring them here (bare
	// identifiers resolve to window globals) makes the static build behave like the dev server.
	window.__DEV__ = true
	window.__PRODUCTION__ = false
	window.__APP_VERSION__ = '0.0.0'
	window.__APP_BUILD_DATE__ = new Date().toISOString()
</script>
